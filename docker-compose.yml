services:
  nox-organizer:
    image: ghcr.io/mapherez/nox-organizer:latest
    container_name: nox-organizer
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "file:/data/nox.db"
    volumes:
      - nox-data:/data
    restart: unless-stopped
    healthcheck:
      # node:slim has no wget/curl — use Node's global fetch instead.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/queue').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  nox-data:
